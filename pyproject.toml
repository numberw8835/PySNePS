[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pysneps"
version = "2.8.0.dev1"
description = "SNePS 2.8 (Semantic Network Processing System) translated to Python: a propositional semantic network, inference engine (SNIP), acting system (SNeRE), belief revision (SNeBR), SNePSLOG and SNePSUL interfaces, with machine-learning export utilities."
readme = "README.md"
license = { file = "COPYING" }
requires-python = ">=3.10"
authors = [{ name = "PySNePS contributors" }]
keywords = ["knowledge representation", "semantic network", "reasoning", "belief revision", "SNePS", "logic", "knowledge graph"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["prompt_toolkit>=3.0"]   # the full-screen interface (sneps.tui)

[project.optional-dependencies]
ml = ["numpy>=1.22", "scipy>=1.8", "networkx>=2.8"]
torch = ["torch>=2.0", "numpy>=1.22"]
dev = ["pytest>=7"]

[project.scripts]
sneps = "sneps.cli:sneps_main"
snepslog = "sneps.cli:snepslog_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sneps = ["py.typed", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
